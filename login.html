<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GetSynced</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
 
<div class="bg-mesh"></div>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
 
<div class="login-wrapper">
  <div class="login-card">
 
    <div class="brand-mark">
      <div class="brand-icon">G</div>
      <div class="brand-text">
        <h1>GetSynced</h1>
        <p>The P Company</p>
      </div>
    </div>
 
    <div class="login-heading">
      <h2>Welcome back</h2>
      <p>Sign in to access your workspace</p>
    </div>
 
    <div class="alert-custom" id="loginAlert">
      <i class="fas fa-exclamation-circle"></i>
      <span id="loginAlertMsg">Invalid email or password. Please try again.</span>
    </div>
    <div class="alert-success" id="loginSuccess">
      <i class="fas fa-check-circle"></i>
      <span id="loginSuccessMsg">Success!</span>
    </div>
 
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <div class="input-group-custom">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" class="form-control" id="email" placeholder="you@company.com" autocomplete="email"/>
      </div>
    </div>
 
    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group-custom">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" class="form-control" id="password" placeholder="Enter your password"/>
        <button class="toggle-pass" onclick="togglePass()" id="toggleBtn">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>
 
    <div class="form-options">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="remember"/>
        <label class="form-check-label" for="remember">Remember me</label>
      </div>
      <a href="#" class="forgot-link" onclick="openResetModal(); return false;">Forgot password?</a>
    </div>
 
    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      Sign In &nbsp;<i class="fas fa-arrow-right fa-sm"></i>
    </button>
 
 
 
  </div>
</div>
 
<!-- Reset Password Modal -->
<div class="modal-backdrop-custom" id="resetModal">
  <div class="modal-box">
    <h3>Reset Password</h3>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    <label class="form-label">Email Address</label>
    <div class="input-group-custom" style="margin-bottom:0">
      <i class="fas fa-envelope input-icon"></i>
      <input type="email" class="form-control" id="resetEmail" placeholder="you@company.com"/>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeResetModal()">Cancel</button>
      <button class="btn-send" id="resetBtn" onclick="handlePasswordReset()">Send Link</button>
    </div>
  </div>
</div>
 
<script type="module" src="/javascript/firebase.js"></script>
<script type="module" src="/javascript/login.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

</body>
</html>
